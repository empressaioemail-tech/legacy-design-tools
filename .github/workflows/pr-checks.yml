name: PR Checks
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      PRIVATE_OBJECT_DIR: /test-bucket/private
      PUBLIC_OBJECT_SEARCH_PATHS: /test-bucket/public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install ripgrep (used by import-boundary tests)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chrome via puppeteer postinstall
        # `puppeteer` (not puppeteer-core) is a direct dep of
        # @workspace/api-server, with a postinstall script (install.mjs)
        # that downloads Chrome to ~/.cache/puppeteer. CI's pnpm install
        # --frozen-lockfile is NOT executing this postinstall (3.9s install
        # time, no Chrome download in logs), and `pnpm rebuild puppeteer`
        # in pnpm v10 only triggers native-compile rebuilds, not pure-JS
        # postinstalls. Workaround: run install.mjs directly. The script
        # is a real file at artifacts/api-server/node_modules/puppeteer/install.mjs
        # (not a pnpm symlink internal) because puppeteer is a direct dep.
        # Node's module resolution from that script's directory finds
        # @puppeteer/browsers in puppeteer's own node_modules subtree.
        run: |
          cd artifacts/api-server
          node node_modules/puppeteer/install.mjs
      - name: Enable pgvector extension
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d test_db -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Push database schema
        run: pnpm --filter @workspace/db run push
      - name: Check schema fixture drift
        # Guardrail: pg_dump the live (just-pushed) schema and diff it
        # against lib/db/src/__tests__/__fixtures__/schema.sql.template.
        # If a schema change was made without running
        # `pnpm --filter @workspace/db run test:fixture:schema`, the
        # checked-in fixture will be stale and integration tests would
        # silently miss new columns/tables. Fail the PR loudly instead.
        run: pnpm --filter @workspace/db run test:fixture:drift
      - name: Checkout hauska-engine (writer disk probe)
        uses: actions/checkout@v4
        with:
          repository: empressaioemail-tech/hauska-engine
          path: hauska-engine-checkout
          sparse-checkout: |
            packages/engine-core/scripts
      - name: Run tests
        env:
          HAUSKA_ENGINE_ROOT: ${{ github.workspace }}/hauska-engine-checkout
        run: pnpm test
  l5-sf30-cotality-grep:
    name: L5 SF-30 Cotality warm grep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: ci-cotality-warm-gate
        run: |
          if rg -n 'canWarm\s*=\s*present\.has\(["'"'"']cotality:' artifacts/api-server/src/lib/warmingHarness.ts; then
            echo "FAIL ci-cotality-warm-gate: Cotality is extinguished; do not gate warm on cotality:*"
            exit 1
          fi
          echo "ci-cotality-warm-gate: clean"
  l5-sf24-sf25-score-greps:
    name: L5 SF-24/SF-25 score greps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: ci-stamp-as-sourcePresent
        run: |
          if rg -n 'sourcePresent:\s*cov\.\w+Pct\s*>\s*0' artifacts/api-server/src/countyCoverageScoreCli.ts; then
            echo "FAIL ci-stamp-as-sourcePresent: stamp rate must not manufacture sourcePresent"
            exit 1
          fi
          echo "ci-stamp-as-sourcePresent: clean"
      - name: ci-coverage-clamp
        run: |
          if rg -n 'Math\.min\(\s*100\s*,\s*\(atomCount' artifacts/api-server/src/countyGeometryScoreCli.ts; then
            echo "FAIL ci-coverage-clamp: overcount must not clamp to 100% satisfied-present"
            exit 1
          fi
          echo "ci-coverage-clamp: clean"
      - name: ci-coverage-clamp-shared-engine
        run: |
          # SF-25 scoped to the RULE, not to the two files the defect was
          # first found in. Every rail's coverage arithmetic now runs through
          # lib/railScoring, so a clamp introduced there would reach every
          # rail at once while both greps above stayed green. Any clamp of a
          # coverage percentage to 100 in that tree fails: overcount is a real
          # signal (duplicate or stale atoms) and must fail closed to not-yet
          # carrying the honest unclamped ratio. Live evidence for why this
          # matters: Bastrop cad and Caldwell cad both store exactly 100.00
          # satisfied-present and are really 121.65% and 184.98%.
          # COMMENT LINES ARE EXCLUDED, and that is not cosmetic. The engine's
          # own header quotes the defect it exists to prevent, so a naive grep
          # matches the documentation and the gate is permanently red: a dead
          # gate, which is DEV_PROCESS 2.0's failure mode and the mirror of
          # CTRL-3, where a defect report's prose granted the defective row
          # authority. This grep matches CODE.
          # rg exit codes: 0 = matches, 1 = no matches, >1 = ERROR. `|| true`
          # around the whole pipeline would make a missing or broken ripgrep
          # read as "clean". A gate that passes when its instrument is absent
          # is worse than no gate. The exit code is captured from rg itself,
          # never from the pipe (DEV_PROCESS 2.3).
          set +e
          RAW=$(rg -n --glob '!*.test.ts' 'Math\.min\(\s*100'             artifacts/api-server/src/lib/railScoring)
          RG_EXIT=$?
          set -e
          if [ "$RG_EXIT" -gt 1 ]; then
            echo "FAIL ci-coverage-clamp-shared-engine: ripgrep errored (exit $RG_EXIT); the gate did not run"
            exit 1
          fi
          MATCHES=$(printf '%s' "$RAW" | grep -vE ':[0-9]+: *(\*|//|/\*)' || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "FAIL ci-coverage-clamp-shared-engine: the shared rail scorer must never clamp coverage to 100"
            exit 1
          fi
          echo "ci-coverage-clamp-shared-engine: clean"
  l5-silent-fallback-greps:
    name: L5 silent-fallback greps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: ci-fake-engine-exists
        run: |
          if rg -n 'includes\(["'"'"']/hauska-engine/["'"'"']\)\)\s*return true' lib/db/src/railManifestDerivation.ts; then
            echo "FAIL ci-fake-engine-exists: read-path must not pretend engine writers exist"
            exit 1
          fi
          echo "ci-fake-engine-exists: clean"
      - name: ci-mock-allowlist-hauska-engine
        run: |
          if rg -n --glob '**/__tests__/**' 'includes\(["'"'"']hauska-engine["'"'"']\)'; then
            echo "FAIL ci-mock-allowlist-hauska-engine: tests must not substring-match hauska-engine paths as existing"
            exit 1
          fi
          echo "ci-mock-allowlist-hauska-engine: clean"
  l5-sf26-hand-hasWriter-grep:
    name: L5 SF-26 hand hasWriter grep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: ci-hand-hasWriter-in-declaration
        run: |
          if rg -n 'hasWriter:\s*(true|false)' lib/db/src/schema/countyRailDimension.ts; then
            echo "FAIL ci-hand-hasWriter-in-declaration: hasWriter must be derived, not hand-declared"
            exit 1
          fi
          echo "ci-hand-hasWriter-in-declaration: clean"
  l17-ci-vintage-predicate:
    name: L17 ci-vintage-predicate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: ci-vintage-predicate
        run: |
          # Fail if production files mention cad_property/cadProperty FROM/from(
          # without importing resolveDeclaredCadVintage/tryResolveDeclaredCadVintage
          # AND without CAD_PROPERTY_MULTI_YEAR_INVENTORY marker.
          # Allowlist: lib/cad-ingest/src/ingest.ts, lib/cad-ingest/src/vintage.ts,
          # lib/cad-ingest/src/vintage-crosswalk.ts, lib/cad-ingest/src/txgio/landuse*.ts,
          # lib/db/src/schema/cadProperty.ts, lib/db/src/schema/cadPropertyVintageCrosswalk.ts,
          # **/__tests__/**
          set -euo pipefail
          mapfile -t hits < <(rg -l \
            -e 'FROM[[:space:]]+cad_property' \
            -e 'from\(cadProperty\)' \
            -e '\.from\(cadProperty\)' \
            --glob '!**/__tests__/**' \
            --glob '!lib/cad-ingest/src/ingest.ts' \
            --glob '!lib/cad-ingest/src/vintage.ts' \
            --glob '!lib/cad-ingest/src/vintage-crosswalk.ts' \
            --glob '!lib/cad-ingest/src/txgio/landuse*.ts' \
            --glob '!lib/db/src/schema/cadProperty.ts' \
            --glob '!lib/db/src/schema/cadPropertyVintageCrosswalk.ts' \
            . || true)
          failed=0
          for f in "${hits[@]+"${hits[@]}"}"; do
            [ -z "${f:-}" ] && continue
            if rg -q 'resolveDeclaredCadVintage|tryResolveDeclaredCadVintage|CAD_PROPERTY_MULTI_YEAR_INVENTORY' "$f"; then
              continue
            fi
            echo "FAIL ci-vintage-predicate: $f queries cad_property without declared-vintage import or CAD_PROPERTY_MULTI_YEAR_INVENTORY marker"
            failed=1
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "ci-vintage-predicate: clean (${#hits[@]} candidate file(s) checked)"
