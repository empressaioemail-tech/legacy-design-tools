name: PR Checks
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install ripgrep (retirement gate + import-boundary tests)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: check-no-hauska-atom-contract
        run: node scripts/check-no-hauska-atom-contract.mjs
      - name: Typecheck
        run: pnpm run typecheck
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      PRIVATE_OBJECT_DIR: /test-bucket/private
      PUBLIC_OBJECT_SEARCH_PATHS: /test-bucket/public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install ripgrep (used by import-boundary tests)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chrome via puppeteer postinstall
        # `puppeteer` (not puppeteer-core) is a direct dep of
        # @workspace/api-server, with a postinstall script (install.mjs)
        # that downloads Chrome to ~/.cache/puppeteer. CI's pnpm install
        # --frozen-lockfile is NOT executing this postinstall (3.9s install
        # time, no Chrome download in logs), and `pnpm rebuild puppeteer`
        # in pnpm v10 only triggers native-compile rebuilds, not pure-JS
        # postinstalls. Workaround: run install.mjs directly. The script
        # is a real file at artifacts/api-server/node_modules/puppeteer/install.mjs
        # (not a pnpm symlink internal) because puppeteer is a direct dep.
        # Node's module resolution from that script's directory finds
        # @puppeteer/browsers in puppeteer's own node_modules subtree.
        run: |
          cd artifacts/api-server
          node node_modules/puppeteer/install.mjs
      - name: Size the postgres lock table for the test suite
        # P-375 (2026-09-19). `Test` has failed intermittently on suites the PR
        # under review does not touch (#722, #727, and P-362's PR) with Postgres
        # error 53200 "out of shared memory" / "You might need to increase
        # max_locks_per_transaction", thrown out of lib/db's `dropTestSchema`.
        # The fleet's answer was "re-run once" (`_queue/cards/ldt-576-retry`),
        # which is a habit, not a control: a real regression in those suites
        # would be re-run away the same way.
        #
        # MEASUREMENT. On a container identical to this service (same image, same
        # env, default max_locks_per_transaction=64, default 64 MB /dev/shm),
        # driving the REAL fixture schema (142 tables, 228 indexes and 246 ADD
        # CONSTRAINT = 616 objects) through the lifecycle the harness uses
        # (DROP SCHEMA IF EXISTS / CREATE SCHEMA / DDL replay / DROP SCHEMA
        # CASCADE):
        #   * one `DROP SCHEMA ... CASCADE` on that schema takes ~2,400 locks in
        #     ONE transaction (binary search on a single session).
        #   * the default lock table holds ~12,800 locks (measured; not the
        #     64 x 101 textbook figure), so about six test files dropping a
        #     schema at the same moment exhaust it. `pnpm test` fans out well
        #     past that, which is why the reds land on untouched suites.
        #   * 12 concurrent schema lifecycles failed in 3 of 4 runs; 24
        #     concurrent failed in 3 of 3 runs, with 20-24 `out of shared memory`
        #     errors each, and left 20-22 schemas behind.
        #   * at max_locks_per_transaction=1024 the same 24-way load was clean in
        #     3 of 3 runs, and 12-way clean in 4 of 4. Measured capacity ~190,000
        #     locks, about 79x the per-operation need.
        #
        # --shm-size IS DELIBERATELY NOT SET, because it was measured not to be
        # the lever: lock capacity is identical (12,800) at 64 MB and at 2 GB of
        # /dev/shm, an equal 12-way load fails on both, and 1024 starts and
        # passes on the stock 64 MB /dev/shm. The lock table is anonymous shared
        # memory, not /dev/shm, so a larger --shm-size can never clear this
        # error; only the GUC sizes it, and the GUC is PGC_POSTMASTER, so it
        # needs a restart. That is what this step does.
        #
        # A job in the service container cannot be given the GUC declaratively
        # (`services.options` is passed to `docker create` and there is no
        # command override), so the step sets it with ALTER SYSTEM, restarts the
        # container, waits for readiness, READS BACK the effective value and
        # fails loudly if it did not take. The effective value is printed on
        # every run: a Test log that does not carry this line, or carries it
        # with the wrong number, is itself the finding and no longer has to be
        # diagnosed from a suite's error text.
        #
        # THE `run:` BLOCK BELOW IS EXECUTED, NOT TRUSTED. It was extracted from
        # this file byte-for-byte and run on a host that runs several containers
        # from the same image, with exactly ONE line rebound (the container
        # selector, because CI has exactly one and this host does not). That is
        # how the `|| true` inside the readiness loop was found: without it the
        # loop's first psql -- which fails on any postgres that is still
        # restarting -- aborted the whole step with exit 2 under `set -e`, so
        # the loop could only ever work when it was not needed. The guard that
        # refuses an ambiguous container list was observed FIRING, not asserted:
        # bound to a name with no container, the step exits 1 with "expected
        # exactly one ... found 0".
        run: |
          set -euo pipefail
          TARGET=1024
          MATCHES=$(docker ps --filter "ancestor=pgvector/pgvector:pg14" --format "{{.ID}}")
          COUNT=$(printf '%s\n' "$MATCHES" | grep -c . || true)
          if [ "$COUNT" != "1" ]; then
            echo "FAIL: expected exactly one pgvector/pgvector:pg14 service container, found $COUNT. Refusing to guess which postgres the suites run against: guessing wrong leaves the lock table unsized and the DB suites fail in the out-of-shared-memory shape, which is a red that reads like a broken test."
            exit 1
          fi
          CONTAINER_ID="$MATCHES"
          docker exec "$CONTAINER_ID" psql -U postgres -d test_db -c "ALTER SYSTEM SET max_locks_per_transaction = $TARGET;"
          docker restart --time 60 "$CONTAINER_ID" > /dev/null
          # --time 60 (not the 10s default) so postgres gets a CLEAN fast shutdown instead of
          # a SIGKILL: an unclean stop makes the next start replay WAL first, which turns a
          # 2-second restart into minutes and would look exactly like a hung Test job.
          # Wait for QUERY readiness, not `pg_isready`: a restart after an unclean stop puts
          # the server in crash recovery, where it answers the socket ("rejecting
          # connections", pg_isready exit 1) long before it can execute anything. Only a
          # real query proves the precondition for reading the setting back.
          #
          # `|| true` IS LOAD-BEARING, and this was found by RUNNING these bytes against a
          # container that was in recovery, not by reading them. Without it the loop is
          # decorative: psql that cannot connect exits 2, `set -o pipefail` makes the whole
          # pipeline 2, and an assignment whose command substitution fails is itself a failed
          # command under `set -e` -- so the FIRST iteration kills the step with a bare exit 2,
          # the loop never loops, and the FAIL message below is unreachable. The loop
          # therefore used to work exactly when it was not needed (CI's freshly-initialised
          # container does a clean fast shutdown and answers the first probe) and fail
          # silently in the one state it exists for. A gating indicator that cannot fire is
          # not a control (DEV_PROCESS).
          READY=""
          for _ in $(seq 1 120); do
            READY=$(docker exec "$CONTAINER_ID" psql -U postgres -d test_db -tAc "SELECT 1;" 2> /dev/null | tr -d '[:space:]' || true)
            if [ "$READY" = "1" ]; then
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "FAIL: postgres did not accept a query within 120s of the restart, so the lock table state is unknown; the DB suites must not run against a server that was never confirmed up"
            exit 1
          fi
          # `|| true` for the same reason as the loop above: a psql that cannot connect must
          # fall through to the comparison and be REPORTED, never abort the step with an
          # unexplained exit 2. `2> /dev/null` keeps the log to our one line, which is the
          # line a reader greps for.
          EFFECTIVE=$(docker exec "$CONTAINER_ID" psql -U postgres -d test_db -tAc "SHOW max_locks_per_transaction;" 2> /dev/null | tr -d '[:space:]' || true)
          echo "effective max_locks_per_transaction=$EFFECTIVE (wanted $TARGET)"
          if [ "$EFFECTIVE" != "$TARGET" ]; then
            echo "FAIL: max_locks_per_transaction reads '$EFFECTIVE', not '$TARGET'; the restart did not take and the DB suites would run on the undersized default"
            exit 1
          fi
      - name: Enable pgvector extension
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d test_db -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Install postgis into the postgres service container
        # TXGIO-GEOM-FIX: txgio_parcel.geom is a real PostGIS geometry(Geometry,4326)
        # column in production (added by an uncodified manual process this card
        # tracks properly for the first time), and upsertTxgioParcels now derives it
        # on every write. pgvector/pgvector:pg14 has no postgis package baked in, but
        # its PGDG apt repo is already configured, so it installs the same way it
        # would on any Debian bookworm host. The server process runs INSIDE the
        # service container, so the package has to land there too, not on the runner.
        run: |
          CONTAINER_ID=$(docker ps --filter "ancestor=pgvector/pgvector:pg14" --format "{{.ID}}")
          docker exec -u root "$CONTAINER_ID" bash -c "apt-get update && apt-get install -y postgresql-14-postgis-3"
      - name: Enable postgis extension
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d test_db -c "CREATE EXTENSION IF NOT EXISTS postgis;"
      - name: Push database schema
        run: pnpm --filter @workspace/db run push
      - name: Check schema fixture drift
        # Guardrail: pg_dump the live (just-pushed) schema and diff it
        # against lib/db/src/__tests__/__fixtures__/schema.sql.template.
        # If a schema change was made without running
        # `pnpm --filter @workspace/db run test:fixture:schema`, the
        # checked-in fixture will be stale and integration tests would
        # silently miss new columns/tables. Fail the PR loudly instead.
        run: pnpm --filter @workspace/db run test:fixture:drift
      - name: Require SIBLING_REPO_READ_TOKEN (A-30)
        # hauska-engine is PRIVATE. The default GITHUB_TOKEN cannot read another
        # repository, so this checkout fails with `Not Found` — which reads like a
        # missing repo rather than a missing credential. Fail by NAME instead.
        # Fork PRs receive no secrets; that is correct and this step says so.
        env:
          SIBLING_REPO_READ_TOKEN: ${{ secrets.SIBLING_REPO_READ_TOKEN }}
        run: |
          if [ -z "$SIBLING_REPO_READ_TOKEN" ]; then
            echo "FAIL: SIBLING_REPO_READ_TOKEN is not set."
            echo "  A fine-grained read-only token carrying contents:read on"
            echo "  hauska-map and hauska-engine, set as a legacy-design-tools Actions"
            echo "  secret by the operator (OPS-25 A-30)."
            exit 1
          fi
          echo "SIBLING_REPO_READ_TOKEN is present"
      - name: Checkout hauska-engine (writer disk probe)
        uses: actions/checkout@v4
        with:
          repository: empressaioemail-tech/hauska-engine
          path: hauska-engine-checkout
          token: ${{ secrets.SIBLING_REPO_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            packages/engine-core/scripts
      - name: Run tests
        env:
          HAUSKA_ENGINE_ROOT: ${{ github.workspace }}/hauska-engine-checkout
        run: pnpm test
  l5-sf30-cotality-grep:
    name: L5 SF-30 Cotality warm grep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: ci-cotality-warm-gate
        run: |
          if rg -n 'canWarm\s*=\s*present\.has\(["'"'"']cotality:' artifacts/api-server/src/lib/warmingHarness.ts; then
            echo "FAIL ci-cotality-warm-gate: Cotality is extinguished; do not gate warm on cotality:*"
            exit 1
          fi
          echo "ci-cotality-warm-gate: clean"
  l5-sf24-sf25-score-greps:
    name: L5 SF-24/SF-25 score greps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: ci-stamp-as-sourcePresent
        run: |
          if rg -n 'sourcePresent:\s*cov\.\w+Pct\s*>\s*0' artifacts/api-server/src/countyCoverageScoreCli.ts; then
            echo "FAIL ci-stamp-as-sourcePresent: stamp rate must not manufacture sourcePresent"
            exit 1
          fi
          echo "ci-stamp-as-sourcePresent: clean"
      - name: ci-coverage-clamp
        run: |
          if rg -n 'Math\.min\(\s*100\s*,\s*\(atomCount' artifacts/api-server/src/countyGeometryScoreCli.ts; then
            echo "FAIL ci-coverage-clamp: overcount must not clamp to 100% satisfied-present"
            exit 1
          fi
          echo "ci-coverage-clamp: clean"
      - name: ci-coverage-clamp-shared-engine
        run: |
          # SF-25 scoped to the RULE, not to the two files the defect was
          # first found in. Every rail's coverage arithmetic now runs through
          # lib/railScoring, so a clamp introduced there would reach every
          # rail at once while both greps above stayed green. Any clamp of a
          # coverage percentage to 100 in that tree fails: overcount is a real
          # signal (duplicate or stale atoms) and must fail closed to not-yet
          # carrying the honest unclamped ratio. Live evidence for why this
          # matters: Bastrop cad and Caldwell cad both store exactly 100.00
          # satisfied-present and are really 121.65% and 184.98%.
          # COMMENT LINES ARE EXCLUDED, and that is not cosmetic. The engine's
          # own header quotes the defect it exists to prevent, so a naive grep
          # matches the documentation and the gate is permanently red: a dead
          # gate, which is DEV_PROCESS 2.0's failure mode and the mirror of
          # CTRL-3, where a defect report's prose granted the defective row
          # authority. This grep matches CODE.
          # rg exit codes: 0 = matches, 1 = no matches, >1 = ERROR. `|| true`
          # around the whole pipeline would make a missing or broken ripgrep
          # read as "clean". A gate that passes when its instrument is absent
          # is worse than no gate. The exit code is captured from rg itself,
          # never from the pipe (DEV_PROCESS 2.3).
          set +e
          RAW=$(rg -n --glob '!*.test.ts' 'Math\.min\(\s*100'             artifacts/api-server/src/lib/railScoring)
          RG_EXIT=$?
          set -e
          if [ "$RG_EXIT" -gt 1 ]; then
            echo "FAIL ci-coverage-clamp-shared-engine: ripgrep errored (exit $RG_EXIT); the gate did not run"
            exit 1
          fi
          MATCHES=$(printf '%s' "$RAW" | grep -vE ':[0-9]+: *(\*|//|/\*)' || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "FAIL ci-coverage-clamp-shared-engine: the shared rail scorer must never clamp coverage to 100"
            exit 1
          fi
          echo "ci-coverage-clamp-shared-engine: clean"
  l5-silent-fallback-greps:
    name: L5 silent-fallback greps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: ci-fake-engine-exists
        run: |
          if rg -n 'includes\(["'"'"']/hauska-engine/["'"'"']\)\)\s*return true' lib/db/src/railManifestDerivation.ts; then
            echo "FAIL ci-fake-engine-exists: read-path must not pretend engine writers exist"
            exit 1
          fi
          echo "ci-fake-engine-exists: clean"
      - name: ci-mock-allowlist-hauska-engine
        run: |
          if rg -n --glob '**/__tests__/**' 'includes\(["'"'"']hauska-engine["'"'"']\)'; then
            echo "FAIL ci-mock-allowlist-hauska-engine: tests must not substring-match hauska-engine paths as existing"
            exit 1
          fi
          echo "ci-mock-allowlist-hauska-engine: clean"
  l5-sf26-hand-hasWriter-grep:
    name: L5 SF-26 hand hasWriter grep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: ci-hand-hasWriter-in-declaration
        run: |
          if rg -n 'hasWriter:\s*(true|false)' lib/db/src/schema/countyRailDimension.ts; then
            echo "FAIL ci-hand-hasWriter-in-declaration: hasWriter must be derived, not hand-declared"
            exit 1
          fi
          echo "ci-hand-hasWriter-in-declaration: clean"
  ss-w16-tier2-flood-not-served:
    name: SS-W16 tier2 flood not served
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: ci-tier2-flood-not-served
        run: |
          # SS-W16 (2026-08-19, P-45). The baked Tier-2 flood facet is RETIRED
          # at the node-facets read path: it asked FEMA NFHL once per
          # 0.005-degree tile at the tile CENTRE, a measured median 227 m from
          # the parcel it answered for, and was correct in 0 of 5,714
          # adjudicated cases including 1,995 parcels reported outside a
          # Special Flood Hazard Area whose centroid is inside one.
          #
          # WHAT THIS GATE CLAIMS, exactly and no wider: on the node-facets read
          # path (ONE named file), the `flood` KEY may only ever be assigned the
          # literal `null`. It does not claim the store is retired, it does not
          # claim other flood surfaces are safe, and it deliberately does not
          # reach the live fema:nfhl-flood-zone map-layer adapter, which queries
          # FEMA at a real point and is a different instrument sharing a string.
          # A control whose scope is broader than its claim teaches people to
          # reach for the bypass, so the scope is pinned to the claim.
          #
          # WHAT BYPASSES IT: a NEW read path under a DIFFERENT name serving the
          # same place_layer_snapshots rows. This gate matches a string in one
          # file; it does not match a rename or a second route. It is a
          # regression tripwire. The semantic guarantee is the `flood: null`
          # TYPE on Tier2Overlay plus the exhaustive producer switch in
          # disposeTier2Flood, both of which travel with the code.
          #
          # THREE OUTCOMES, NOT TWO: clean / violation / DID-NOT-RUN. A check
          # that cannot run and silently passes is the defect class this whole
          # programme exists for, so "did not run" is its own loud, greppable
          # outcome (marker GATE-DID-NOT-RUN, RESULT=did-not-run, exit 2) and
          # never collapses into either pass or ordinary failure.
          #
          # SELF-TEST FIRST, IN BOTH DIRECTIONS. Before any verdict on the real
          # file is trusted, the predicate is run against a fixture that DOES
          # violate it and a fixture that does NOT. A predicate that flags
          # nothing is a starved gate; a predicate that flags everything is a
          # dead gate, permanently red, which is how this step behaved when
          # first written (the comment-strip regex assumed rg's multi-file
          # output format). Either failure reports DID-NOT-RUN rather than a
          # verdict. This wires in "a check seen only passing has not been seen
          # working": the gate is observed both failing and passing every run.
          set -uo pipefail

          FILE=artifacts/api-server/src/routes/brokerageNodeFacets.ts

          did_not_run() {
            echo "GATE-DID-NOT-RUN ci-tier2-flood-not-served: $1"
            echo "RESULT=did-not-run"
            exit 2
          }

          # Returns 0 when the target is CLEAN, 1 when it VIOLATES, and exits
          # did_not_run when the instrument itself could not answer. Offenders
          # are printed on the violation path.
          #
          # rg exit codes: 0 = matches, 1 = no matches, >1 = ERROR. The exit code
          # is captured from rg itself, never from a pipe, so a missing or broken
          # ripgrep can never read as "no matches" and therefore as clean.
          #
          # --with-filename is NOT cosmetic. Given a single file argument rg
          # omits the filename and prints "LINE:content", so a comment-strip
          # regex anchored on ":LINE:" (correct for the directory-scanning greps
          # elsewhere in this workflow) matches nothing.
          #
          # COMMENT LINES ARE EXCLUDED and that is not cosmetic either. The
          # route's own header documents the retirement it implements, so a
          # naive grep matches its own documentation — the dead-gate failure
          # mode that ci-coverage-clamp-shared-engine in this same workflow
          # already records. POSIX classes, not \s: \s in ERE is a GNU extension
          # and this gate must not depend on which grep the runner ships.
          scan() {
            local target="$1"
            local raw rg_exit offenders
            raw=$(rg -n --with-filename 'flood\s*:' "$target")
            rg_exit=$?
            if [ "$rg_exit" -gt 1 ]; then
              did_not_run "ripgrep errored (exit $rg_exit) scanning $target"
            fi
            offenders=$(printf '%s' "$raw" \
              | grep -vE '(^|:)[0-9]+:[[:space:]]*(\*|//|/\*)' \
              | grep -vE 'flood[[:space:]]*:[[:space:]]*null[[:space:]]*[,;]?[[:space:]]*$')
            if [ -n "$offenders" ]; then
              printf '%s\n' "$offenders"
              return 1
            fi
            return 0
          }

          command -v rg >/dev/null 2>&1 || did_not_run "ripgrep is not installed"

          # ---- SELF-TEST A: a known violation MUST be flagged ---------------
          DIRTY=$(mktemp)
          cat > "$DIRTY" <<'DIRTY_EOF'
          export interface Tier2Overlay {
            flood: null;
          }
          export function extractTier2Overlay(p: Record<string, unknown>) {
            return { flood: p.flood, floodDisposition: null };
          }
          DIRTY_EOF
          if scan "$DIRTY" > /dev/null; then
            rm -f "$DIRTY"
            did_not_run "self-test A failed: the predicate did not flag a known violation, so a 'clean' verdict would be meaningless"
          fi
          rm -f "$DIRTY"

          # ---- SELF-TEST B: a compliant file MUST NOT be flagged ------------
          # Mirrors the real route's SHAPE, not just its rule: the same comment
          # noise (a comment-strip regression is what makes this gate
          # permanently red) and the same one-assignment-per-line formatting.
          #
          # The permitted-assignment pattern is END-ANCHORED, so `flood: null`
          # must sit on its own line. That is deliberate: an un-anchored pattern
          # would also swallow a line like `flood: null, legacy: p.flood`, which
          # smuggles a value past the gate on the tail of a compliant head.
          # Prettier already formats this object one property per line, so the
          # constraint costs nothing — but it IS a constraint, and this fixture
          # is what proves the two agree.
          CLEAN=$(mktemp)
          cat > "$CLEAN" <<'CLEAN_EOF'
          /**
           * `flood: null` is documented here on purpose. A gate that matches its
           * own documentation is a dead gate.
           */
          export interface Tier2Overlay {
            flood: null;
          }
          export function extractTier2Overlay(p: Record<string, unknown>) {
            // returns flood: null and a typed refusal instead of a value
            return {
              flood: null,
              floodDisposition: disposeTier2Flood(p.flood),
            };
          }
          CLEAN_EOF
          if ! scan "$CLEAN" > /dev/null; then
            rm -f "$CLEAN"
            did_not_run "self-test B failed: the predicate flagged a compliant file, so this gate is permanently red and enforces nothing"
          fi
          rm -f "$CLEAN"
          echo "ci-tier2-flood-not-served: self-test passed in both directions"

          # ---- VERDICT on the real file -------------------------------------
          [ -f "$FILE" ] || did_not_run "$FILE is missing; the read path was renamed or removed and this gate no longer covers it"

          if ! scan "$FILE"; then
            echo "FAIL ci-tier2-flood-not-served: the node-facets read path must not assign a Tier-2 flood value. It is retired (SS-W16); read flood hazard from the flood-hazard-fact atom instead."
            echo "RESULT=violation"
            exit 1
          fi

          # A gate that can pass on its own absence is not a gate. TWO markers
          # are required and are checked SEPARATELY:
          #
          #   flood: null;   the Tier2Overlay TYPE field (the compile-time floor)
          #   flood: null,   the object-literal ASSIGNMENT in extractTier2Overlay
          #
          # A single `flood:\s*null` probe is satisfiable by the type field
          # alone, so deleting the assignment read as clean when this step was
          # first written — the sentinel-satisfiable shape, a check passing on a
          # value that does not carry its meaning.
          if ! rg -q 'flood[[:space:]]*:[[:space:]]*null;' "$FILE"; then
            echo "FAIL ci-tier2-flood-not-served: the Tier2Overlay type no longer pins flood to null in $FILE; the compile-time floor was removed"
            echo "RESULT=violation"
            exit 1
          fi
          if ! rg -q 'flood[[:space:]]*:[[:space:]]*null,' "$FILE"; then
            echo "FAIL ci-tier2-flood-not-served: extractTier2Overlay no longer assigns flood: null in $FILE; the retirement was removed rather than kept"
            echo "RESULT=violation"
            exit 1
          fi

          echo "ci-tier2-flood-not-served: clean"
          echo "RESULT=clean"
  ss-w18-api-server-boot:
    # LOAD-BEARING NAME. "SS-W18 api-server boots" is a REQUIRED status check on
    # main (branch protection Stage 2). Protection matches the check-run name, so
    # renaming this silently removes the requirement with no error and a green PR.
    # Change it only together with the protection setting.
    name: SS-W18 api-server boots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ci-boot-graph-no-cli-import
        run: |
          # SS-W18 (2026-08-19, P-47). No module reachable from the server
          # entrypoint may statically import a `*Cli` module. A CLI's
          # isDirectRun() guard does not survive esbuild bundling, so its
          # main() runs at server boot and can process.exit(1) before Express
          # listens. That is what killed the canary deploy of 5688aa31.
          #
          # THIS GATE IS A GRAPH WALK, NOT A GREP, and that is the whole point.
          # The live defect sat three hops from routes/index.ts behind the
          # lib/railScoring barrel re-export. A grep over routes/ would have
          # been green through the entire outage. Re-export through an
          # intermediate module is the obvious bypass of a grep, so this
          # control does not have one.
          #
          # THREE OUTCOMES, NOT TWO. The script exits 0 clean / 1 violation /
          # 2 did-not-run, and this step keeps them distinguishable in the run
          # summary. A did-not-run FAILS the job: a check that cannot run and
          # silently passes is the defect class this gate exists for.
          set +e
          node artifacts/api-server/scripts/checkBootGraphNoCliImports.mjs
          CODE=$?
          set -e
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          case "$CODE" in
            0) echo "ci-boot-graph-no-cli-import: RESULT=clean" >> "$SUMMARY" ;;
            1) echo "ci-boot-graph-no-cli-import: RESULT=violation" >> "$SUMMARY"; exit 1 ;;
            2) echo "ci-boot-graph-no-cli-import: RESULT=did-not-run (GATE-DID-NOT-RUN)" >> "$SUMMARY"; exit 1 ;;
            *) echo "ci-boot-graph-no-cli-import: RESULT=did-not-run (unexpected exit $CODE)" >> "$SUMMARY"; exit 1 ;;
          esac
      - name: Build api-server bundle
        run: pnpm --filter @workspace/api-server run build
      - name: ci-api-server-boot-smoke
        run: |
          # SS-W18 (2026-08-19, P-47). Start the built bundle, wait for the
          # port, kill it. Its ABSENCE is why four merges between 2026-08-16
          # and 2026-08-19 all shipped unbootable with green CI: typecheck and
          # vitest never start the process, so nothing in this workflow
          # consumed the one signal that would have caught it.
          #
          # The harness self-tests its own probe in both directions before it
          # renders a verdict, refuses to answer if the probe port is already
          # occupied, and kills the child in a finally under a hard deadline.
          # Same three outcomes and the same did-not-run handling as above.
          set +e
          node artifacts/api-server/scripts/bootSmokeTest.mjs
          CODE=$?
          set -e
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          case "$CODE" in
            0) echo "ci-api-server-boot-smoke: RESULT=pass" >> "$SUMMARY" ;;
            1) echo "ci-api-server-boot-smoke: RESULT=violation" >> "$SUMMARY"; exit 1 ;;
            2) echo "ci-api-server-boot-smoke: RESULT=did-not-run (GATE-DID-NOT-RUN)" >> "$SUMMARY"; exit 1 ;;
            *) echo "ci-api-server-boot-smoke: RESULT=did-not-run (unexpected exit $CODE)" >> "$SUMMARY"; exit 1 ;;
          esac

  l17-ci-vintage-predicate:
    name: L17 ci-vintage-predicate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: ci-vintage-predicate
        run: |
          # Fail if production files mention cad_property/cadProperty FROM/from(
          # without importing resolveDeclaredCadVintage/tryResolveDeclaredCadVintage
          # AND without CAD_PROPERTY_MULTI_YEAR_INVENTORY marker.
          # Allowlist: lib/cad-ingest/src/ingest.ts, lib/cad-ingest/src/vintage.ts,
          # lib/cad-ingest/src/vintage-crosswalk.ts, lib/cad-ingest/src/txgio/landuse*.ts,
          # lib/db/src/schema/cadProperty.ts, lib/db/src/schema/cadPropertyVintageCrosswalk.ts,
          # **/__tests__/**
          set -euo pipefail
          mapfile -t hits < <(rg -l \
            -e 'FROM[[:space:]]+cad_property' \
            -e 'from\(cadProperty\)' \
            -e '\.from\(cadProperty\)' \
            --glob '!**/__tests__/**' \
            --glob '!lib/cad-ingest/src/ingest.ts' \
            --glob '!lib/cad-ingest/src/vintage.ts' \
            --glob '!lib/cad-ingest/src/vintage-crosswalk.ts' \
            --glob '!lib/cad-ingest/src/txgio/landuse*.ts' \
            --glob '!lib/db/src/schema/cadProperty.ts' \
            --glob '!lib/db/src/schema/cadPropertyVintageCrosswalk.ts' \
            . || true)
          failed=0
          for f in "${hits[@]+"${hits[@]}"}"; do
            [ -z "${f:-}" ] && continue
            if rg -q 'resolveDeclaredCadVintage|tryResolveDeclaredCadVintage|CAD_PROPERTY_MULTI_YEAR_INVENTORY' "$f"; then
              continue
            fi
            echo "FAIL ci-vintage-predicate: $f queries cad_property without declared-vintage import or CAD_PROPERTY_MULTI_YEAR_INVENTORY marker"
            failed=1
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "ci-vintage-predicate: clean (${#hits[@]} candidate file(s) checked)"

  ci-pr-base-is-main:
    # LOAD-BEARING NAME. "PR base is main" is a REQUIRED status check on main
    # (branch protection). Protection matches the check-run name, so renaming
    # this silently removes the requirement with no error and a green PR.
    # Change it only together with the protection setting.
    #
    # PR #601 (2026-09-04, overlayDistricts serve cutover) merged into an
    # abandoned stacked-PR branch instead of main; nothing caught the wrong
    # base at merge time, and its content only reached main because #602
    # happened to retarget and carry it along. This is a metadata check on
    # the PR itself, not a content grep: every PR into this repo targets
    # main, full stop. Stacked-PR branches may still merge into each other
    # locally if a lane wants that shape, but the repo's own PRs never do.
    name: PR base is main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: ci-pr-base-is-main
        run: |
          if [ "${{ github.event.pull_request.base.ref }}" != "main" ]; then
            echo "FAIL ci-pr-base-is-main: PR #${{ github.event.pull_request.number }} targets '${{ github.event.pull_request.base.ref }}', not main. Retarget the PR base to main."
            exit 1
          fi
          echo "ci-pr-base-is-main: clean (base is main)"

  cortex-daily-limit-bake:
    name: cortex daily limit bake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: ci-cortex-daily-limit-50000
        run: |
          # --set-env-vars is authoritative-replace. 10000 locked the operator
          # out twice on 2026-08-28. The bake must stay 50000.
          if rg -n 'CORTEX_USER_DAILY_API_LIMIT=10000' .github/workflows/cloud-run-deploy.yml; then
            echo "FAIL ci-cortex-daily-limit-50000: bake is 10000; a deploy will lock the operator out"
            exit 1
          fi
          if ! rg -q -- '--set-env-vars=.*CORTEX_USER_DAILY_API_LIMIT=50000' .github/workflows/cloud-run-deploy.yml; then
            echo "FAIL ci-cortex-daily-limit-50000: --set-env-vars bake is missing CORTEX_USER_DAILY_API_LIMIT=50000"
            exit 1
          fi
          echo "ci-cortex-daily-limit-50000: clean"

  p279-tagged-revision-env-predicate:
    name: P-279 tagged-revision env predicate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: P-279 predicate over the shipped fixture set
        # P-279. A tagged revision cannot outlive an auth or secret variable the
        # SERVING revision carries. Finding fa9addb4 removed the instance; this
        # row builds the class control.
        #
        # This job is the OFFLINE half (no cloud access, no credentials): the same
        # predicate that gates the deploy workflows, run over checked-in fixtures —
        # a passing service, a failing one, four refusal shapes, and an executed
        # reverted-predicate falsifier proving the check is not syntax-only.
        #
        # The LIVE half runs in cloud-run-deploy.yml and
        # cloud-run-deploy-smartsite-mcp.yml, after the canary deploy and again
        # after the traffic shift, where the exit code fails the job. What is here
        # keeps the RULE from rotting; it does not watch a deploy.
        #
        # Exit codes stay distinguishable and 2 (REFUSE) FAILS this job: a check
        # that could not read what it needs and reads as green is the defect class
        # this exists for (DEV_PROCESS 2.0/2.3).
        run: |
          set +e
          node scripts/check-tagged-revision-env.mjs --selftest
          CODE=$?
          set -e
          case "$CODE" in
            0) echo "p279-tagged-revision-env-predicate: RESULT=clean" ;;
            1) echo "p279-tagged-revision-env-predicate: RESULT=violation (the shipped fixture set did not pass)"; exit 1 ;;
            2) echo "p279-tagged-revision-env-predicate: RESULT=did-not-run (REFUSE)"; exit 1 ;;
            *) echo "p279-tagged-revision-env-predicate: RESULT=did-not-run (unexpected exit $CODE)"; exit 1 ;;
          esac

  p279-tagged-revision-env-divergence:
    name: P-279 canonical divergence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate the canonical-copy fetch (A-30)
        # A-30 (OPS-25, 2026-09-23). hauska-engine is PRIVATE, so the canonical copy
        # this check fetches is only readable under an Authorization header; without
        # one the fetch returns 404 and the check REFUSEs with CANONICAL_UNREADABLE on
        # every run. Unreadable is not a pass, so the control is correct — it is the
        # credential that was missing.
        #
        # WHY CURL_HOME RATHER THAN AN EDIT TO THE SCRIPT, which is what A-30 named.
        # scripts/check-tagged-revision-env.mjs and tools/check-tagged-revision-env.mjs
        # in hauska-engine are BYTE-IDENTICAL ON PURPOSE, and that byte-identity is
        # this very job's control (DEV_PROCESS 2.4). Editing the fetch in one copy
        # changes its sha256, so the pair diverges and this check goes red until an
        # identical change lands in hauska-engine — a lock-step cross-repo merge whose
        # intermediate state is a broken main, in a repo this lane does not own. The
        # script's contract is "curl this canonical URL"; supplying the credential to
        # curl keeps both copies byte-identical and makes the read authenticated, which
        # is the outcome A-30 asked for.
        #
        # The read is not silent: the next step PROVES the token can read the canonical
        # copy before the check depends on it, so a later CANONICAL_UNREADABLE is
        # genuinely about the copy rather than about a missing credential.
        env:
          SIBLING_REPO_READ_TOKEN: ${{ secrets.SIBLING_REPO_READ_TOKEN }}
        run: |
          if [ -z "$SIBLING_REPO_READ_TOKEN" ]; then
            echo "FAIL: SIBLING_REPO_READ_TOKEN is not set."
            echo "  A fine-grained read-only token carrying contents:read on"
            echo "  hauska-engine, set as a legacy-design-tools Actions secret by the"
            echo "  operator (OPS-25 A-30). Fork PRs receive no secrets by design."
            exit 1
          fi
          # curl reads $CURL_HOME/.curlrc on every invocation. Scoped to a temp dir so
          # the header is not left on the runner's home. 600: the token is a secret.
          CURL_DIR="$RUNNER_TEMP/p279-curl"
          mkdir -p "$CURL_DIR"
          printf 'header = "Authorization: Bearer %s"\n' "$SIBLING_REPO_READ_TOKEN" > "$CURL_DIR/.curlrc"
          chmod 600 "$CURL_DIR/.curlrc"
          echo "CURL_HOME=$CURL_DIR" >> "$GITHUB_ENV"
          echo "canonical fetch authenticated via curlrc (token not printed)"
      - name: Positive control - the token can actually read the canonical copy
        # DEV_PROCESS 2.2: a gating indicator is proven able to FIRE before it is
        # trusted, and here the negative case matters more. A token that cannot read
        # the canonical copy would leave the divergence step REFUSing for an
        # unstated reason, so the read is proven here and the failure names itself.
        env:
          CANONICAL_URL: https://raw.githubusercontent.com/empressaioemail-tech/hauska-engine/main/tools/check-tagged-revision-env.mjs
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$CANONICAL_URL")
          echo "canonical copy HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "FAIL: the canonical copy is unreadable with SIBLING_REPO_READ_TOKEN (HTTP $CODE)."
            echo "  The token is missing a contents:read grant on hauska-engine, or the"
            echo "  canonical path moved. The divergence check below cannot judge either"
            echo "  way, and an unjudgeable control is not a pass."
            exit 1
          fi
      - name: P-279 canonical divergence byte-compare
        # DEV_PROCESS 2.4. scripts/check-tagged-revision-env.mjs here and
        # tools/check-tagged-revision-env.mjs in hauska-engine are byte-identical on
        # purpose. Two implementations of one rule drift into two rules; this
        # compares them and REFUSES (never passes) on any byte difference, or when
        # the canonical copy cannot be read at all.
        #
        # canonicalRef is the hauska-engine main branch. A commit-SHA pin was rejected
        # deliberately: a squash-merge can make a branch commit unreachable, which
        # would read as a broken gate rather than as drift, and a SHA pin would need
        # re-pinning by hand on every canonical edit.
        run: |
          set +e
          node scripts/check-tagged-revision-env.mjs --check-divergence
          CODE=$?
          set -e
          case "$CODE" in
            0) echo "p279-canonical-divergence: RESULT=clean" ;;
            2) echo "p279-canonical-divergence: RESULT=refused (the two copies differ, or the canonical copy could not be read - see the message above; this is NOT a pass)"; exit 1 ;;
            *) echo "p279-canonical-divergence: RESULT=did-not-run (unexpected exit $CODE)"; exit 1 ;;
          esac
