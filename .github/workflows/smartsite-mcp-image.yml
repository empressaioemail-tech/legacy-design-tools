name: smartsite-mcp image

# Builds the smartsite-mcp production image on every PR so a missing COPY of a
# workspace package (the PR #830 / lib/icc-notice failure) fails here, not at
# deploy time in do-image.yml. BUILD ONLY: push is false, no registry login,
# no secrets. Dockerfile and context match do-image.yml (service smartsite-mcp):
# artifacts/smartsite-mcp/Dockerfile, context = monorepo root.
#
# Branch protection must list "smartsite-mcp image builds" as a required check
# (integration/operator setting; not done by this file).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: smartsite-mcp-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-builds:
    name: smartsite-mcp image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: artifacts/smartsite-mcp/Dockerfile
          push: false
          cache-from: type=gha,scope=smartsite-mcp-image
          cache-to: type=gha,mode=max,scope=smartsite-mcp-image
